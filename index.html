        :root {
            --primary: #2563eb;

            --success-bg: #dcfce7;
            --error: #dc2626;
            --error-bg: #fee2e2;
            --bg: #fff5f8;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #f3d2e4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            padding: 24px 20px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.08);
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 1.9rem;
            background: linear-gradient(135deg, var(--primary), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .sticky-stats {
            position: sticky;
            top: 10px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.93);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.12);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid var(--border);
        }

        .stat-item {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .stat-item span {
            color: var(--pink-dark);
            font-weight: 700;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button.btn {
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.2);
        }

        button.btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        }

        button.btn-pink {
            background: linear-gradient(135deg, var(--pink), #f43f5e);
            box-shadow: 0 2px 6px rgba(236, 72, 153, 0.25);
        }

        button.btn-pink:hover {
            box-shadow: 0 4px 10px rgba(236, 72, 153, 0.35);
        }

        button.btn-reset {
            background-color: #64748b;
        }

        button.btn-reset:hover {
            background-color: #475569;
        }

        .quiz-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border);
            transition: border-color 0.2s;
        }

        .question-card:hover {
            border-color: #f472b6;
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text);
            display: flex;
            gap: 10px;
        }

        .question-num {
            background: var(--pink-light);
            color: var(--pink-dark);
            padding: 2px 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            height: fit-content;
            white-space: nowrap;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: #fff0f5;
            border: 1px solid #fbcfe8;
            border-radius: 10px;
            padding: 12px 16px;
            text-align: left;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .option-btn:hover:not([disabled]) {
            background: #fce7f3;
            border-color: #f472b6;
            transform: translateX(2px);
        }

        .option-prefix {
            font-weight: 700;
            min-width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #fbcfe8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            color: var(--pink-dark);
        }

        /* State styles */
        .option-btn.correct {
            background-color: var(--success-bg) !important;
            border-color: var(--success) !important;
            color: #14532d;
            font-weight: 600;
        }

        .option-btn.correct .option-prefix {
            background-color: var(--success);
            color: white;
        }

        .option-btn.incorrect {
            background-color: var(--error-bg) !important;
            border-color: var(--error) !important;
            color: #7f1d1d;
        }

        .option-btn.incorrect .option-prefix {
            background-color: var(--error);
            color: white;
        }

        .option-btn[disabled] {
            cursor: default;
        }

        .feedback {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
            font-weight: 500;
        }

        .feedback.show-correct {
            display: block;
            background-color: var(--success-bg);
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .feedback.show-incorrect {
            display: block;
            background-color: var(--error-bg);
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
    </style>
</head>

        let correctAnswersCount = 0;

        function initQuiz(questions) {
            currentQuestions = JSON.parse(JSON.stringify(questions));
            userAnswers = {};
            correctAnswersCount = 0;
            updateStats();

            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            currentQuestions.forEach((qObj, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                const title = document.createElement('div');
                title.className = 'question-title';
                title.innerHTML = `<span class="question-num">${index + 1}</span> <span>${qObj.q}</span>`;
                card.appendChild(title);

                const optionsList = document.createElement('div');
                optionsList.className = 'options-list';

                const prefixes = ['A', 'B', 'C', 'D'];

                qObj.options.forEach((opt, optIndex) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.id = `opt-${index}-${optIndex}`;
                    btn.innerHTML = `<span class="option-prefix">${prefixes[optIndex]}</span> <span>${opt}</span>`;
                    btn.onclick = () => selectOption(index, optIndex, opt, qObj.ans);
                    optionsList.appendChild(btn);
                });

                card.appendChild(optionsList);

                const feedback = document.createElement('div');
                feedback.className = 'feedback';
                feedback.id = `feedback-${index}`;
                card.appendChild(feedback);

                container.appendChild(card);
            });
        }

        function selectOption(qIdx, selectedOptIdx, selectedText, correctAnsText) {
            if (userAnswers[qIdx] !== undefined) return;

            const qObj = currentQuestions[qIdx];
            const isCorrect = (selectedText.trim() === correctAnsText.trim());

            userAnswers[qIdx] = { selected: selectedOptIdx, isCorrect: isCorrect };

            if (isCorrect) {
                correctAnswersCount++;
            }

            qObj.options.forEach((_, optIdx) => {
                const btn = document.getElementById(`opt-${qIdx}-${optIdx}`);
                btn.disabled = true;

                if (qObj.options[optIdx].trim() === correctAnsText.trim()) {
                    btn.classList.add('correct');
                } else if (optIdx === selectedOptIdx && !isCorrect) {
                    btn.classList.add('incorrect');
                }
            });

            const feedback = document.getElementById(`feedback-${qIdx}`);
            if (isCorrect) {
                feedback.className = 'feedback show-correct';
                feedback.innerHTML = ' Chính xác!';
            } else {
                feedback.className = 'feedback show-incorrect';
                feedback.innerHTML = ` Sai rồi! Đáp án đúng là: <strong>${correctAnsText}</strong>`;
            }

            updateStats();
        }

        function updateStats() {
            const doneCount = Object.keys(userAnswers).length;
            document.getElementById('done-count').innerText = doneCount;
            document.getElementById('correct-count').innerText = correctAnswersCount;

            const pct = doneCount > 0 ? Math.round((correctAnswersCount / doneCount) * 100) : 0;
            document.getElementById('score-pct').innerText = pct + '%';
        }

        function resetQuiz() {
            if (confirm('Bạn có chắc chắn muốn làm lại từ đầu không?')) {
                initQuiz(originalQuestions);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function shuffleQuiz() {
            if (confirm('Đảo câu hỏi sẽ reset bài làm hiện tại. Bạn có muốn tiếp tục?')) {
                let shuffled = [...originalQuestions];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                initQuiz(shuffled);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        window.onload = () => {
            initQuiz(originalQuestions);
        };
    </script>
</body>

</html>
